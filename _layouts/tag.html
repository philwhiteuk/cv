---
layout: default
description: "Projects by Phil White tagged {{ page.title | capitalize }}."
---

<section class="primary scroll-snap-align-start scroll-snap-stop-always">
    <div class="mx-auto max-w-content px-[var(--fluid-gutter)] py-0 my-[var(--fluid-gutter-sm)] w-full box-border flex flex-row flex-wrap justify-between gap-[var(--fluid-gutter-sm)]">
        {%- if page.title -%}
        <h1 class="page-heading text-fluid-4 font-500 letter-spacing-[-0.03em] leading-[1.05] my-[calc(var(--fluid-gutter-sm)*0.5)]">{{ page.title }}</h1>
        {%- endif -%}
        <div class="basis-full h-0"></div>
        {{ content }}
    </div>
    <div class="mx-auto max-w-content px-[var(--fluid-gutter)] py-0 my-[var(--fluid-gutter-sm)] w-full box-border flex flex-row flex-wrap justify-between gap-[var(--fluid-gutter-sm)]">
        {%- include projects.html tag=page.title -%}
    </div>
</section>
