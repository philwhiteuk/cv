<header class="secondary sticky top-0 z-[100] w-full min-h-[7vh] border-t-[0.2rem] border-t-[#7700ff] shadow-[0_2px_10px_rgba(0,0,0,0.3)]" role="banner">
    <div class="wrapper flex-row! flex-nowrap! items-center m-0! gap-[calc(var(--fluid-gutter-sm)*0.5)]!">
        <nav class="flex flex-row! flex-nowrap! items-center justify-between w-full gap-x-4! gap-y-0! max-[53.125rem]:flex-wrap!">
            <div class="w-[clamp(2.5rem,2.5vw,4.5rem)] overflow-hidden rounded-[50%] border border-transparent">
                <img class="block w-full h-auto" src="{{ '/assets/images/profile.jpeg' | relative_url }}" alt="my profile photo"/>
            </div>
            <h1 class="flex-1 text-(length:--fluid-step-3)!"><a class="site-title" rel="author" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a></h1>
            <input class="hide" id="menu-toggle" type="checkbox" />
            <label for="menu-toggle" class="hide-lg block w-[clamp(1.5rem,3vw,2.5rem)] h-[clamp(1.5rem,3vw,2.5rem)] bg-[url(/cv/assets/images/icons.svg#icon-menu-view)] bg-no-repeat bg-[size:clamp(1.5rem,3vw,2.5rem)]" aria-label="menu toggle"></label>
            <div class="hide-lg break"></div>
            <ul class="hide-sm hide-md flex flex-row! flex-nowrap! items-center justify-end gap-(--fluid-gutter)! max-[53.125rem]:[#menu-toggle:checked~&]:flex! max-[53.125rem]:[#menu-toggle:checked~&]:flex-col! max-[53.125rem]:[#menu-toggle:checked~&]:gap-[calc(var(--fluid-gutter-sm)*0.2)]! max-[53.125rem]:[#menu-toggle:checked~&]:mb-(--fluid-gutter)! max-[53.125rem]:[#menu-toggle:checked~&]:w-full">
                {%- assign pages = site.pages | sort: 'order' -%}
                {% for _page in pages %}
                {% if _page.title %}
                <li class="{% if _page.permalink == page.url %}active {% endif %}max-[53.125rem]:[#menu-toggle:checked~ul_&]:w-full"><a class="menu-link{% if _page.permalink == page.url %} underline!{% endif %}" href="{{ _page.permalink | relative_url }}">{{ _page.nav_title | default: _page.title }}</a></li>
                {% endif %}
                {% endfor %}
                <li class="max-[53.125rem]:[#menu-toggle:checked~ul_&]:w-full"><button class="menu-link" aria-label="contact" name="contact" onclick="javascript:(() => document.querySelector('dialog')?.showModal())()" type="button">Contact</button></li>
            </ul>
        </nav>
    </div>
</header>
