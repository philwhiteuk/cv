<footer class="secondary scroll-snap-align-start scroll-snap-stop-always">
  <div class="mx-auto max-w-content px-[var(--fluid-gutter)] py-[var(--fluid-gutter-sm)] w-full box-border flex flex-row flex-wrap justify-between gap-[var(--fluid-gutter-sm)]">
    <p class="text-secondary-fg">\u00a9 {{ site.title | escape }} {{ site.time | date: "%Y" }}</p>
    <ul id="social" class="flex flex-row flex-nowrap items-center gap-[calc(var(--fluid-gutter-sm)*0.25)]">
      {%- if site.github_username -%}
      <li>
        <a class="flex items-center text-secondary-fg hover:no-underline" href="https://github.com/{{ site.github_username }}">
          <svg class="w-[clamp(16px,2vw,24px)] h-[clamp(16px,2vw,24px)] fill-secondary-fg" viewBox="0 0 24 24">
            <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.165 6.839 9.49.5.092.682-.217.682-.482 0-.237-.009-.868-.014-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.031-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.203 2.398.1 2.651.64.7 1.03 1.595 1.03 2.688 0 3.848-2.338 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.001 10.001 0 0022 12c0-5.523-4.477-10-10-10z" clip-rule="evenodd" />
          </svg>
        </a>
      </li>
      {%- endif -%}
      {%- if site.linkedin_username -%}
      <li>
        <a class="flex items-center text-secondary-fg hover:no-underline" href="https://www.linkedin.com/in/{{ site.linkedin_username| cgi_escape | escape }}">
          <svg class="w-[clamp(16px,2vw,24px)] h-[clamp(16px,2vw,24px)] fill-secondary-fg" viewBox="0 0 24 24">
            <path fill-rule="evenodd" d="M16.338 16.338H13.67V12.16c0-.995-.017-2.277-1.387-2.277-1.39 0-1.601 1.086-1.601 2.207v4.248H8.014v-8.59h2.559v1.174h.037c.356-.675 1.227-1.387 2.526-1.387 2.703 0 3.203 1.778 3.203 4.092v4.711zM5.005 6.575a1.548 1.548 0 11-.003-3.096 1.548 1.548 0 01.003 3.096zm-1.337 9.763H6.34v-8.59H3.667v8.59zM17.668 1H6.328C3.965 1 2 2.985 2 5.355v13.29C2 21.015 3.965 23 6.328 23h11.34C20.035 23 22 21.015 22 18.645V5.355C22 2.985 20.035 1 17.668 1z" clip-rule="evenodd" />
          </svg>
        </a>
      </li>
      {%- endif -%}
    </ul>
  </div>
</footer>
